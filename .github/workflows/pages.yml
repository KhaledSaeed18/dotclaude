name: pages

# Deploys the catalog site under `site/` to GitHub Pages. The site is static
# and has no build step; `site/data.json` is generated by `pnpm gen` and
# committed, so a catalog change is a change under `site/` and redeploys.
# `validate` on the same push already proves data.json is not stale.

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
