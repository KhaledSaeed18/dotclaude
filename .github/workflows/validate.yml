name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Coverage
        # The suite is black-box, so this collects V8 coverage from the spawned
        # child processes; ordinary tooling would report 0% here.
        run: pnpm coverage

      - name: Check generated files are in sync
        run: pnpm gen:check

      - name: Validate registry
        run: pnpm validate

      # Pinned so CI never executes an unreviewed release; bump deliberately.
      # Installed once here so both steps below reuse it instead of resolving
      # the package on every CLI call the smoke test makes.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.201

      - name: Validate plugin marketplace
        run: claude plugin validate .

      - name: Smoke-test plugin installs
        # Installs every generated plugin into a throwaway config dir and runs
        # the bundled hook scripts from where they land. `plugin validate` only
        # checks the manifest's shape; this checks the plugins actually work.
        env:
          SMOKE_CLAUDE_CLI: claude
        run: pnpm smoke
